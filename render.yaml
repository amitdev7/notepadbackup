# ---------------------------------------------------------------------------
# Render Blueprint Specification for Zenithsui (Next.js 16 App Router)
# ---------------------------------------------------------------------------

services:
  - type: web
    name: zenithsui
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/db/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PNPM_VERSION
        value: 10.4.1
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "10000"
