<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="20%" cy="15%" r="65%" fx="20%" fy="15%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="25%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass card filter -->
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1280" height="640" fill="#090D16"/>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>
  <rect width="1280" height="640" fill="url(#blueGlow)"/>
  <rect width="1280" height="640" fill="url(#indigoGlow)"/>

  <!-- Subtle Blueprint Canvas Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>

    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Left Side: Product Branding & Narrative -->
  <g transform="translate(88, 120)">
    <!-- Pill Badge: Release & Nature -->
    <rect width="210" height="32" rx="16" fill="#1E293B" fill-opacity="0.8" stroke="url(#borderGrad)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#10B981"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">LOCAL-FIRST WORKSPACE</text>

    <!-- Main Title -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
      zenithsui
    </text>

    <!-- Gradient Tagline -->
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="28" font-weight="600" fill="url(#brandAccent)" letter-spacing="-0.5">
      Wireframes that know they're wireframes.
    </text>

    <!-- Descriptive Paragraph -->
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" width="480">
      <tspan x="0" dy="0">A minimalist paper-like infinite canvas where real shadcn/ui</tspan>
      <tspan x="0" dy="26">components render as tactile hand-drawn napkins. Think by</tspan>
      <tspan x="0" dy="26">sketching, iterate in seconds, and persist 100% locally.</tspan>
    </text>

    <!-- Feature Pillars Badges Row -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: Procedural Rough.js -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" font-family="monospace" font-size="11" font-weight="600" fill="#38BDF8">Rough.js Canvas</text>
      </g>

      <!-- Badge 2: Local-First IndexedDB -->
      <g transform="translate(148, 0)">
        <rect width="138" height="32" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" font-family="monospace" font-size="11" font-weight="600" fill="#A78BFA">IndexedDB First</text>
      </g>

      <!-- Badge 3: Peer-to-Peer LAN -->
      <g transform="translate(296, 0)">
        <rect width="134" height="32" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" font-family="monospace" font-size="11" font-weight="600" fill="#34D399">Wi-Fi LAN Sync</text>
      </g>

      <!-- Badge 4: Electron Native -->
      <g transform="translate(440, 0)">
        <rect width="124" height="32" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" font-family="monospace" font-size="11" font-weight="600" fill="#F472B6">Desktop App</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Liquid Glass Preview Showcase Card -->
  <g transform="translate(680, 88)" filter="url(#glassShadow)">
    <!-- Glass Backdrop -->
    <rect width="512" height="464" rx="28" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Simulated Top Bar Window Controls & Capsule -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="5" fill="#EF4444" fill-opacity="0.8"/>
      <circle cx="24" cy="8" r="5" fill="#F59E0B" fill-opacity="0.8"/>
      <circle cx="40" cy="8" r="5" fill="#10B981" fill-opacity="0.8"/>

      <!-- Center Frosted Capsule Pill -->
      <g transform="translate(110, -4)">
        <rect width="250" height="26" rx="13" fill="#1E293B" fill-opacity="0.7" stroke="#475569" stroke-width="0.8"/>
        <text x="24" y="17" font-family="monospace" font-size="10" font-weight="600" fill="#94A3B8">canvas-sketch-01 • saved</text>
        <circle cx="210" cy="13" r="3" fill="#10B981"/>
      </g>
    </g>

    <!-- Canvas Workspace Mockup Inside Glass Frame -->
    <g transform="translate(24, 64)">
      <!-- Canvas Paper Surface -->
      <rect width="464" height="376" rx="18" fill="#0F172A" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>

      <!-- Wireframe Wire Component 1: Card Container -->
      <rect x="36" y="32" width="392" height="180" rx="12" fill="#1E293B" fill-opacity="0.4" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="4 2"/>

      <!-- Wireframe Element: Nav Header -->
      <rect x="56" y="52" width="120" height="18" rx="4" fill="#3B82F6" fill-opacity="0.3" stroke="#60A5FA" stroke-width="1"/>
      <rect x="320" y="52" width="88" height="18" rx="4" fill="#6366F1" fill-opacity="0.3" stroke="#818CF8" stroke-width="1"/>

      <!-- Wireframe Element: Hero Heading Sketch Lines -->
      <path d="M 56 100 Q 180 98 280 101" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
      <path d="M 56 116 Q 140 114 210 117" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

      <!-- Wireframe Element: CTA Buttons -->
      <rect x="56" y="146" width="94" height="28" rx="6" fill="#2563EB" stroke="#60A5FA" stroke-width="1.5"/>
      <text x="74" y="164" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Get Started</text>

      <rect x="160" y="146" width="86" height="28" rx="6" fill="transparent" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="182" y="164" font-family="sans-serif" font-size="10" font-weight="medium" fill="#94A3B8">Live Demo</text>

      <!-- Wireframe Wire Component 2: Sticky Hover Note -->
      <g transform="translate(250, 230)">
        <rect width="180" height="120" rx="14" fill="#FEF08A" fill-opacity="0.15" stroke="#FACC15" stroke-width="1.5"/>
        <rect x="14" y="14" width="70" height="12" rx="3" fill="#FACC15" fill-opacity="0.4"/>
        <path d="M 14 42 Q 80 41 150 43" stroke="#FEF08A" stroke-width="2" stroke-linecap="round"/>
        <path d="M 14 58 Q 70 57 130 59" stroke="#FEF08A" stroke-width="2" stroke-linecap="round"/>
        <path d="M 14 74 Q 60 73 110 75" stroke="#FEF08A" stroke-width="2" stroke-linecap="round"/>
        <circle cx="156" cy="98" r="6" fill="#FACC15"/>
      </g>

      <!-- Procedural Hand-drawn Arrow Connecting Hero to Note -->
      <path d="M 110 184 Q 160 250 240 270" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
      <polygon points="244,268 234,264 238,274" fill="#F59E0B"/>

      <!-- Floating Tool Dock Indicator at Bottom -->
      <g transform="translate(142, 328)">
        <rect width="180" height="34" rx="17" fill="#1E293B" fill-opacity="0.85" stroke="#475569" stroke-width="1"/>
        <circle cx="28" cy="17" r="7" fill="#3B82F6"/>
        <circle cx="56" cy="17" r="6" fill="#64748B" fill-opacity="0.6"/>
        <circle cx="84" cy="17" r="6" fill="#64748B" fill-opacity="0.6"/>
        <circle cx="112" cy="17" r="6" fill="#64748B" fill-opacity="0.6"/>
        <circle cx="140" cy="17" r="6" fill="#64748B" fill-opacity="0.6"/>
      </g>
    </g>
  </g>
</svg>
